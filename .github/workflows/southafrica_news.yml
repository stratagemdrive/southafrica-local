name: Update South Africa News JSON

on:
  schedule:
    # 6:00 AM EST = 11:00 UTC | 6:00 PM EST = 23:00 UTC
    - cron: '0 11,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Fetch Script
        run: python fetch_southafrica_news.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/southafrica_news.json
          git status
          git diff --staged --quiet || (git commit -m "Automated update: southafrica_news.json [skip ci]" && git push)
